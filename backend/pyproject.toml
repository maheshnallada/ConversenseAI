[project]
name = "health-call-observability"
version = "0.1.0"
description = "Health call observability platform — Phase 1 ingestion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.1",
    "openai>=1.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
